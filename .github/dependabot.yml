version: 2

updates:
  - package-ecosystem: npm
    directory: /source/ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      ui-minor-and-patch:
        update-types: [minor, patch]
      ui-major:
        update-types: [major]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
