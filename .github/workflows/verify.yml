name: Verify

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Five independent jobs that run in parallel.
jobs:
  ui-lint:
    name: UI lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: source/ui
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check formatting, lint and types
        run: pnpm exec vp check

      - name: Check the architecture (Steiger)
        run: pnpm exec steiger src

  ui-test:
    name: UI tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run tests
        working-directory: source/ui
        run: pnpm exec vp test

  cpp-format:
    name: C++ format
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check formatting
        run: scripts/format.sh --check

  # clang-tidy needs the compilation database and the generated headers, not a build: configure
  # and the embedded UI (ui_assets.h) are enough. Branches check what changed since main; main
  # checks everything, which also catches files affected only through other headers.
  cpp-tidy:
    name: C++ tidy
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Native setup
        uses: ./.github/actions/native-setup

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Configure
        run: cmake --preset release

      - name: Generate headers
        run: cmake --build --preset release --target even_ui_assets

      - name: Run clang-tidy
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            scripts/tidy.sh release -j "$(sysctl -n hw.ncpu)"
          else
            scripts/tidy.sh release --since origin/main -j "$(sysctl -n hw.ncpu)"
          fi

  cpp-build:
    name: C++ build & tests
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CMake builds the UI into the plug-in.
      - name: Setup
        uses: ./.github/actions/setup

      - name: Native setup
        uses: ./.github/actions/native-setup
        with:
          ccache-key: verify-macos

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Run tests
        run: ctest --preset release

      # Loads the VST3 as hosts do and checks it at the highest strictness, the editor included.
      - name: Validate the plug-in (pluginval)
        run: scripts/pluginval.sh

      # Zipped with ditto: bundles keep their executable bits, symlinks and signatures.
      - name: Package the build
        run: |
          artefacts=build/release/source/app/even_artefacts/Release
          mkdir -p dist
          ditto -c -k --keepParent "${artefacts}/VST3/Even.vst3" dist/Even.vst3.zip
          ditto -c -k --keepParent "${artefacts}/Standalone/Even.app" dist/Even.app.zip
          scripts/macos/build-pkg.sh "$artefacts" dist

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: even-macos-${{ github.sha }}
          path: dist/
          retention-days: 14
